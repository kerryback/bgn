# Example configuration file for Refactor2
# Usage: python main.py --config example_config.yaml

# Model selection: bgn, kp, or gs
model: gs

# Simulation parameters
start_iter: 0
num_iters: 10

# Panel dimensions
N: 100          # Number of firms
T: 400          # Number of time periods (excluding burnin)
burnin: 200     # Burnin period

# DKKM parameters
include_mkt: false
nmat: 1                      # Number of random weight matrices
nfeatures_lst: [6, 36, 360]  # Different feature counts to test
n_ipca_rff: 36

# Regularization parameters
alpha_lst_fama: [0]
# For GS model, alpha_lst is automatically adjusted
# For other models, use:
# alpha_lst: [0, 0.0001, 0.001, 0.01, 0.05, 0.1, 1]

# IPCA parameters
ipca_nfactors_lst: [1, 2]

# Computation parameters
n_jobs: 10

# Output directory
output_dir: results
